<article class="post-card">
    <header class="post-header">
        <a class="post-author" href="{% url 'music:user_music' track.owner.username %}">
            <span class="post-avatar">
                {% if track.owner.avatar %}
                    <img src="{{ track.owner.avatar.url }}" alt="">
                {% else %}
                    {{ track.owner.username|first|upper }}
                {% endif %}
            </span>
            <span>
                <strong>{{ track.owner.username }}</strong>
                <time datetime="{{ track.uploaded_at|date:'c' }}">{{ track.uploaded_at|timesince }} назад</time>
            </span>
        </a>
    </header>
    <div class="post-content">
        <p>Опубликовал(а) новый трек</p>
        <div class="post-track" data-track-id="{{ track.pk }}">
            <span class="post-track-icon" aria-hidden="true">♫</span>
            <span class="post-track-info">
                <strong>{{ track.title }}</strong>
                <span>{{ track.artist }}</span>
            </span>
            <button class="post-track-play" type="button"
                data-track-play
                data-track-id="{{ track.pk }}"
                data-track-url="{{ track.audio_file.url }}"
                data-track-title="{{ track.title }}"
                data-track-artist="{{ track.artist }}"
                data-track-cover="{% if track.album and track.album.cover %}{{ track.album.cover.url }}{% endif %}"
                aria-label="Воспроизвести: {{ track.title }} — {{ track.artist }}">▶</button>
            <a class="post-track-link" href="{{ track.get_absolute_url }}">
                Открыть трек <span aria-hidden="true">↗</span>
            </a>
        </div>
    </div>
</article>
