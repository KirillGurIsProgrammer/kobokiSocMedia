{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111216">
  <title>{% block title %}Koboki{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=4">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Основная навигация">
      <a class="brand" href="/" aria-label="Koboki — главная">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-name">koboki<span class="brand-period">.</span></span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/">Главная</a>
        <a class="nav-link" href="{% url 'chat:inbox' %}">Сообщения</a>
        {% if user.is_authenticated %}
          <span class="nav-user">{{ user.username }}</span>
          <form class="nav-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-link nav-button" type="submit">Выйти</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Войти</a>
        {% endif %}
      </div>
    </nav>
  </header>
  {% for message in messages %}
    <p class="msg msg-{{ message.tags }}">{{ message }}</p>
  {% endfor %}
  <main class="site-main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span class="footer-brand">Koboki · музыка и люди</span></footer>
</body>
</html>
