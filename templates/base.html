{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111216">
    <title>{% block title %}Koboki{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Основная навигация">
            <a class="brand" href="/" aria-label="Koboki — главная">
                <span class="brand-mark" aria-hidden="true">K</span>
                <span class="brand-name">koboki<span class="brand-period">.</span></span>
            </a>
            <div class="nav-links">
                <a class="nav-link" href="/">Главная</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'accounts:profile' user.username %}">Мой профиль</a>
                    <form class="nav-form" method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="nav-link nav-button" type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'accounts:login' %}">Войти</a>
                    <a class="button button--small" href="{% url 'accounts:register' %}">Создать аккаунт</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span class="footer-brand">Koboki · музыка и люди</span>
    </footer>
</body>
</html>
