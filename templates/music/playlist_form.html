{% extends "base.html" %}
{% block title %}{% if playlist %}Изменить плейлист{% else %}Новый плейлист{% endif %}{% endblock %}
{% block content %}
<div class="music-form-page">
    <span class="eyebrow">ТВОЯ МУЗЫКА</span>
    <h1>{% if playlist %}Изменить плейлист{% else %}Создать плейлист{% endif %}</h1>
    <form class="form-card" method="post" enctype="multipart/form-data">
        {% csrf_token %}{{ form.as_p }}
        <button class="button" type="submit">{% if playlist %}Сохранить{% else %}Создать плейлист{% endif %}</button>
        <a class="text-link" href="{% if playlist %}{{ playlist.get_absolute_url }}{% else %}{% url 'music:playlists' %}{% endif %}">Отмена</a>
    </form>
</div>
{% endblock %}
