{% extends "base.html" %}
{% block title %}{% if album %}Изменить альбом{% else %}Новый альбом{% endif %}{% endblock %}

{% block content %}
<h1>{% if album %}Изменить альбом{% else %}Новый альбом{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if album %}Сохранить{% else %}Создать альбом{% endif %}</button>
  <a href="{% url 'music:library' %}">Отмена</a>
</form>
{% endblock %}
