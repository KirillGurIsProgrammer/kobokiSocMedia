{% extends "base.html" %}
{% block title %}Загрузить трек{% endblock %}

{% block content %}
<h1>Загрузить трек</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Загрузить</button>
  <a href="{% url 'music:library' %}">Отмена</a>
</form>
{% endblock %}
