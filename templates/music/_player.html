{% load music_tags %}
{% listen_along_session as listen_session %}
<section class="music-player" data-music-player data-now-playing-url="{% url 'music:now_playing_update' %}" aria-label="Музыкальный плеер">
    <audio id="music-audio" preload="metadata"></audio>
    <div class="listen-along-banner" data-listen-along-banner
        {% if not listen_session %}hidden{% else %}
            data-host="{{ listen_session.host.username }}"
            data-host-endpoint="{% url 'music:now_playing_detail' listen_session.host.username %}"
            data-leave-url="{% url 'music:listen_along_leave' %}"
        {% endif %}>
        <span>Вы слушаете вместе с <strong data-listen-along-host>{% if listen_session %}@{{ listen_session.host.username }}{% endif %}</strong></span>
        <form method="post" action="{% url 'music:listen_along_leave' %}" data-listen-along-leave>
            {% csrf_token %}<button type="submit">Выйти</button>
        </form>
    </div>
    <p class="listen-along-notice" data-listen-along-notice hidden></p>
    <div class="music-player-track">
        <div class="music-player-cover" data-player-cover aria-hidden="true"><span>♫</span></div>
        <div class="music-player-copy">
            <strong data-player-title>Выберите трек</strong>
            <span data-player-artist>Музыка Koboki</span>
        </div>
        <form class="music-player-like-form" method="post" action="{% url 'music:toggle_like' 0 %}" data-player-like-form data-like-form data-track-id="">
            {% csrf_token %}
            <button class="music-player-icon" type="submit" data-player-like aria-label="Нравится" title="Нравится" disabled aria-pressed="false">♡</button>
            <span class="music-player-like-count" data-like-count></span>
        </form>
    </div>

    <div class="music-player-controls">
        <div class="music-player-buttons">
            <button type="button" data-player-previous aria-label="Предыдущий трек" title="Предыдущий трек">|‹</button>
            <button class="music-player-play" type="button" data-player-toggle aria-label="Воспроизвести" title="Воспроизвести">▶</button>
            <button type="button" data-player-next aria-label="Следующий трек" title="Следующий трек">›|</button>
        </div>
        <div class="music-player-timeline">
            <span data-player-current>0:00</span>
            <input type="range" min="0" max="1000" value="0" data-player-seek aria-label="Позиция воспроизведения" disabled>
            <span data-player-duration>0:00</span>
        </div>
    </div>

    <div class="music-player-extras">
        <label class="music-volume" aria-label="Громкость">
            <span aria-hidden="true">◖</span>
            <input type="range" min="0" max="1" step="0.01" value="0.8" data-player-volume>
        </label>
        <button class="music-player-icon" type="button" data-queue-toggle aria-expanded="false" aria-controls="music-queue">Очередь</button>
        <span class="music-player-listener-count" data-host-listener-count hidden>С вами слушают: 0</span>
    </div>
    <div class="music-queue" id="music-queue" data-player-queue hidden>
        <h2>Очередь воспроизведения</h2>
        <ol data-queue-items></ol>
    </div>
</section>
